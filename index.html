<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROLLER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ROLLER</h1>

  <div id="game-area">
    <canvas id="game" width="800" height="400"></canvas>

    <div id="pause-menu" hidden>
      <div class="pause-panel">
        <h2>PAUSED</h2>
        <div class="level-buttons">
          <button type="button" data-level="0">1</button>
          <button type="button" data-level="1">2</button>
          <button type="button" data-level="2">3</button>
        </div>
      </div>
    </div>
  </div>

  <p id="message">Loading...</p>

  <p class="controls">
    LEFT / RIGHT arrow to roll &nbsp;&middot;&nbsp;
    SPACE or UP arrow to jump &nbsp;&middot;&nbsp;
    R to restart &nbsp;&middot;&nbsp;
    E for menu
  </p>

  <!-- ===================================================================
       THE ORDER OF THESE FILES MATTERS. Each one uses the ones above it.
       If you add a new file, add it to this list too, in the right spot.
       =================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/breakable.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
